<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🏷️ Title and identity -->
    <title>Filipe Costa — Data Scientist Portfolio</title>
    <meta name="author" content="Filipe Costa" />
    <meta
      name="description"
      content="Filipe Costa — Data Scientist with 3+ years of experience delivering scalable ML systems, data pipelines, and applied AI research. EngD Data Science candidate at JADS. Former Prozis and CERN/LIP researcher."

      name="keywords"
      content="Filipe Costa, Data Scientist, Machine Learning, Computer Vision, Multimodal AI, Recommender Systems, DuckDB, Polars, FastAPI, Azure Databricks, EngD, JADS, CERN, LIP, Data Engineering"
    />

    <!-- ⚡ SEO & sharing -->
    <meta property="og:title" content="Filipe Costa — Data Scientist Portfolio" />
    <meta
      property="og:description"
      content="Machine Learning · Data Engineering · Applied AI · EngD @ JADS. Explore projects in recommender systems, multimodal vision-language models, and humanitarian data analytics."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://costinha66.github.io/portfolio/" />
    <meta
      property="og:image"
      content="preview.png"
    />

    <!-- 🐦 Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Filipe Costa — Data Scientist Portfolio" />
    <meta
      name="twitter:description"
      content="Explore machine learning systems, data warehouses, and multimodal AI projects."
    />
    <meta
      name="twitter:image"
      content="preview.png"
    />

    <!-- 🧠 Structured data (helps Google connect your identity) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Filipe Costa",
      "jobTitle": "Data Scientist",
      "affiliation": {
        "@type": "CollegeOrUniversity",
        "name": "Jheronimus Academy of Data Science (JADS)"
      },
      "url": "https://costinha66.github.io/portfolio/",
      "image": "preview.png",
      "sameAs": [
        "https://github.com/Costinha66",
        "https://linkedin.com/in/filipe-costa-data-science"
      ],
      "alumniOf": [
        { "@type": "CollegeOrUniversity", "name": "Faculdade de Ciências da Universidade do Porto" }
      ],
      "knowsAbout": [
        "Machine Learning",
        "Data Engineering",
        "Computer Vision",
        "Recommender Systems",
        "LLMs",
        "Multimodal AI",
        "Statistical Analysis"
      ]
    }
    </script>

    <!-- 🧭 Favicon + theme color -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="./output.css" rel="stylesheet">
    <meta name="theme-color" content="#0f172a" />
